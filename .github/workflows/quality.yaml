name: Quality Checks

on:
  workflow_call:

jobs:
  quality:
    name: "Quality Checks"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: "Setup PDM"
        uses: pdm-project/setup-pdm@v4
        with:
          cache: true
          python-version-file: "pyproject.toml"

      - name: "Install dependencies"
        run: pdm install --frozen-lockfile --group dev

      - name: "Format Check"
        id: format
        run: "pdm run format:check"

      - name: "Lint Check"
        id: lint
        run: "pdm run lint"

      - name: "Type Check"
        id: typecheck
        run: "pdm run typecheck"

  quality-pnpm:
    name: "Quality Checks (pnpm)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: "Install pnpm"
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4
        with:
          cache: true

      - name: "Install dependencies"
        run: pnpm install

      - name: "Format Check"
        id: format
        run: "pnpm run format:check"

  tests:
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: "Setup PDM"
        uses: pdm-project/setup-pdm@v4
        with:
          cache: true
          python-version: ${{ matrix.python-version }}

      - name: "Install dependencies"
        run: pdm install --frozen-lockfile --group dev

      - name: "Run tests"
        run: pdm run tox

  tests-pass: # ref: https://github.com/orgs/community/discussions/4324#discussioncomment-3477871
    runs-on: ubuntu-latest
    needs: [tests]
    if: always() && github.event_name != 'schedule'
    steps:
      - name: "Tests succeeded"
        if: ${{ !(contains(needs.*.result, 'failure')) }}
        run: exit 0
      - name: "Tests failed"
        if: ${{ contains(needs.*.result, 'failure') }}
        run: exit 1
