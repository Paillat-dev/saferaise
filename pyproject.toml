[build-system]
requires = ["hatchling", "hatch-vcs", "hatch-fancy-pypi-readme"]
build-backend = "hatchling.build"

[project]
name = "saferaise"
requires-python = "==3.14.*"
dependencies = []
dynamic = ["version", "urls", "readme"]
authors = [
    { name = "Paillat-dev", email = "me@paillat.dev" }
]
description = "Checked exceptions for Python. Declare what your functions raise, and let saferaise enforce it - using your existing try/except blocks."
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
    "Operating System :: OS Independent",
]
keywords = ["exceptions", "checked exceptions", "type checking", "error handling"]
license = "MIT"
license-files = ["LICENSE"]

[dependency-groups]
dev = [
    "basedpyright>=1.38.2",
    "tox>=4.47.3",
    "tox-gh>=1.7.1",
    "black>=26.3.1",
    "isort>=6.1.0",
    "flake8>=7.3.0",
    "pyupgrade>=3.21.2",
    "flake8-bugbear>=25.11.29",
    "flake8-annotations>=3.2.0",
    "flake8-simplify>=0.30.0",
    "flake8-comprehensions>=3.17.0",
    "flake8-builtins>=3.1.0",
    "flake8-print>=5.0.0",
    "pep8-naming>=0.15.1",
    "flake8-errmsg>=0.6.0",
    "flake8-implicit-str-concat>=0.6.0",
    "flake8-commas>=4.0.0",
    "flake8-return>=1.2.0",
    "flake8-type-checking>=3.2.0",
    "flake8-unused-arguments>=0.0.14",
    "flake8-datetimez>=20.10.0",
    "flake8-raise>=0.0.5",
    "flake8-pie>=0.16.0",
    "flake8-boolean-trap>=1.0.1",
    "flake8-2020>=1.8.1",
    "flake8-debugger>=4.1.2",
    "flake8-eradicate>=1.5.0",
    "flake8-quotes>=3.4.0",
    "tryceratops>=2.4.1",
    "perflint>=0.8.1",
    "pylint>=3.3.9",
    "flake8-logging>=1.8.0",
]
docs = [
    "zensical>=0.0.24",
    "mkdocstrings[python]>=1.0.3",
]
test = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/saferaise/_version.py"

[tool.hatch.metadata.hooks.vcs.urls]
Homepage = "https://github.com/Paillat-dev/saferaise"
Documentation = "https://paillat.dev/saferaise/"
"Source code" = "https://github.com/Paillat-dev/saferaise/archive/{commit_hash}.zip"

[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"
start-after = "# saferaise\n"
end-before = "\n## Installation"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"
start-after = "<!-- quick start -->\n"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\[(.+?)\]\(((?!https?://)\S+?)\)'
replacement = '[\1](https://github.com/Paillat-dev/saferaise/tree/main\g<2>)'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\\?\[!(NOTE|TIP|IMPORTANT|WARNING|CAUTION)\]'
replacement = '**\1**:'

[tool.hatchling]
name = "saferaise"

[tool.hatch.build]
include = [
    "src/saferaise/",
]
exclude = [
    ".github",
    ".python-version",
    "pdm.lock",
    "pnpm-lock.yaml",
    "package.json",
]

[tool.hatch.build.targets.wheel]
packages = ["src/saferaise"]


[tool.pyright]
venv = ".venv"
reportAny = false
reportUnusedCallResult = false
reportMissingTypeStubs = false
pythonVersion = "3.13"
executionEnvironments = [
    { root = "src/saferaise/_version.py", reportDeprecated = false },
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.tox]
requires = ["tox>=4"]
env_list = ["3.13"]

[tool.tox.env_run_base]
description = "run unit tests"
commands = [["pytest", { replace = "posargs", default = ["tests"], extend = true }]]
dependency_groups = ["test"]

[tool.tox.gh.python]
"3.13" = ["3.13"]

[tool.black]
line-length = 120
target-version = ["py313"]
skip-string-normalization = false
skip-magic-trailing-comma = false
force-exclude = '''
/(
  src/saferaise/_version\.py
)/
'''

[tool.isort]
profile = "black"
line_length = 120
force_sort_within_sections = true
force_single_line = false
combine_as_imports = false
split_on_trailing_comma = true
order_by_type = true
force_grid_wrap = 3
extend_skip = ["src/saferaise/_version.py"]

[tool.bandit]
severity = "low"
confidence = "low"
skips = []
exclude_dirs = [".venv", "build", "dist", "tests"]
exclude = ["src/saferaise/_version.py"]

[tool.pylint.format]
max-line-length = 120

[tool.pylint.messages_control]
disable = [
    "C0301",
    "C0303",
    "C0304",
    "C0321",
    "C0411",
    "C0412",
    "C0413",
    "W0611",
]

[tool.pylint.main]
ignore = ["_version.py"]

[tool.pdm.scripts]
format.composite = [
    "black src tests",
    "isort --settings-path . src tests",
    "python scripts/run_pyupgrade.py",
]
"format:check".composite = [
    "black --check --diff src tests",
    "isort --settings-path . --check-only --diff src tests",
    "python scripts/run_pyupgrade.py --check",
]
lint.composite = [
    "flake8 src tests",
    "pylint src",
]
typecheck = "basedpyright src"
"docs:build" = "zensical build --clean"